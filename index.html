<style>
:root{--bg:#000000;--card:#000000;--el:#161616;--bd:#2b2b2b;--tx:#FFFFFF;--tx2:#a8a8a8;--pu:#ff0000;--vi:#ff4d4d;--teal:#36C9C1;--lime:#C7F36B;--co:#ff9f1a;--vio:#7aa7ff;--g:#ff0000;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f5f5f5;--card:#fff;--el:#eeeeee;--bd:#dddddd;--tx:#111111;--tx2:#666666;--pu:#e00000;--vi:#e00000;--teal:#1BA39B;--lime:#6FA32A;--co:#d97706;--vio:#3b6fd9;--g:#e60000;color-scheme:light}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.45 Manrope,Inter,system-ui,sans-serif;display:flex}
button,select,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--vi);outline-offset:2px}
.num{font-family:"JetBrains Mono",ui-monospace,monospace}

.big{font-size:30px;font-weight:700}.lbl{color:var(--tx2);font-size:13px}

.bars>div{position:relative}.tp{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--el);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.5;white-space:nowrap;z-index:5;text-align:left;color:var(--tx);font-style:normal;box-shadow:0 6px 20px #000a}.tp.l{left:0;transform:none}.tp.r{left:auto;right:0;transform:none}.bars>div:hover .tp,.bars>div:focus .tp{display:block}

.item{padding:10px 0;border-top:1px solid var(--bd)}.item:first-child{border-top:0}
.ind{margin-left:16px;border-left:2px solid var(--bd);padding-left:12px}
.tag{font-size:12px;padding:2px 8px;border-radius:20px;background:var(--el);color:var(--tx2)}
.timer{font-size:64px;font-weight:700;text-align:center;margin:14px 0;letter-spacing:2px}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tabs button{padding:6px 14px;border-radius:20px;background:var(--el);white-space:nowrap}.tabs .on{background:var(--g);color:#fff}

.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.mg>b{text-align:center;font-size:12px;color:var(--tx2)}
.mc{min-height:100px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:6px;cursor:pointer;overflow:hidden}
.mc.o{opacity:.4}.mc.sel{border-color:var(--vi);box-shadow:0 0 0 1px var(--vi)}.mc.today .dn{background:var(--g);color:#fff}
.dn{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;font-size:12px}

.th{height:58px;padding:4px;text-align:center;font-size:12px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--card);z-index:3;overflow:hidden}.th.tdy{color:var(--vi);font-weight:700}
.tb2{position:relative;background-image:linear-gradient(var(--bd) 1px,transparent 1px);background-size:100% 44px}
.blk{--c:var(--pu);position:absolute;left:2px;right:2px;border-radius:7px;padding:2px 5px;font-size:11px;overflow:hidden;background:color-mix(in srgb,var(--c) 32%,var(--card));border-left:3px solid var(--c);cursor:pointer;z-index:1}
.blk.ses{pointer-events:none;opacity:.85}.now{position:absolute;left:0;right:0;height:2px;background:var(--co);z-index:2;pointer-events:none}
.leg{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:20px;background:var(--el);font-size:12px}.leg i{width:9px;height:9px;border-radius:50%;background:var(--c)}.leg.off{opacity:.4}
.ov{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:14px}
.md{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;width:min(440px,100%);max-height:90vh;overflow:auto}.md h3{font-size:17px;margin-bottom:12px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--tx2);margin-bottom:10px}.err{color:var(--co);font-size:13px}
.pal{width:min(560px,100%);align-self:start;margin-top:10vh}.pal input{width:100%;margin-bottom:8px}.pal button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:9px 10px;border-radius:10px}.pal button:hover,.pal button.f{background:var(--el)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--el);border:1px solid var(--bd);padding:10px 16px;border-radius:12px;z-index:60}
@media(max-width:900px){.pl{grid-template-columns:1fr}}
@media(max-width:760px){nav{width:70px;padding:10px 6px}.brand{justify-content:center;padding:2px 0 10px}.bt,.me{display:none}.grp{font-size:0;padding:0;margin:6px 10px;border-top:1px solid #00000050}
nav button{flex-direction:column;gap:3px;font-size:10px;padding:8px 2px;align-items:center;text-align:center}nav button.on::before{left:-6px}
main{padding:14px 12px 24px}.timer{font-size:52px}.mc{min-height:62px;padding:3px}.mc .ev{font-size:0;height:5px;padding:0}.mg{gap:3px}}
</style></head><body>
<script>
window.__crash=function(m){try{if(!document.getElementById('boot'))return;var d=document.getElementById('crash');if(!d){d=document.createElement('div');d.id='crash';d.setAttribute('style','position:fixed;left:0;top:0;right:0;bottom:0;z-index:999;background:#000;color:#fff;padding:20px;overflow:auto;font:15px system-ui,sans-serif');document.body.appendChild(d)}
d.innerHTML='<h2 style="color:#f33;margin:0 0 8px">Study OS could not start</h2><p style="color:#aaa;margin:0 0 10px">Your data is safe in this browser. Send this error text to get it fixed.</p><pre style="white-space:pre-wrap;background:#111;padding:10px;border-radius:8px;color:#ddd"></pre><p><button id="cr1" style="background:#f00;color:#fff;border:0;padding:10px 16px;border-radius:10px;font-weight:700">Download my data</button> <button id="cr2" style="background:#222;color:#fff;border:0;padding:10px 16px;border-radius:10px;font-weight:700">Reset timer and reload</button></p>';
d.querySelector('pre').textContent=String(m);
document.getElementById('cr1').onclick=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([localStorage.getItem('studyos_v1')||'{}'],{type:'application/json'}));a.download='studyos-raw-backup.json';a.click()};
document.getElementById('cr2').onclick=function(){try{localStorage.removeItem('so_timer');sessionStorage.removeItem('so_timer')}catch(x){}location.reload()}}catch(x){}};
window.addEventListener('error',function(e){window.__crash(e.message+(e.filename?' ('+e.lineno+':'+e.colno+')':''))});
window.addEventListener('unhandledrejection',function(e){window.__crash(e.reason&&e.reason.message||e.reason)});
</script>
<nav id="nav"></nav><main id="main"><div class="card" id="boot" style="margin:20px"><b>Loading Study OS…</b><p class="lbl">If this message stays on screen, the file did not load completely or JavaScript is blocked. Upload the full index.html again (it should be about 180 KB).</p></div></main><noscript><p style="padding:20px">Study OS needs JavaScript.</p></noscript>
<script>
const KEY='studyos_v1',STAT=['Not Started','Planned','Learning','Partially Completed','Completed','Revision Needed','Mastered'],DONE=['Completed','Mastered'];
const PAGES=[['dashboard','Dashboard'],['academics','Academics'],['planner','Planner'],['focus','Focus'],['exams','Exams'],['analytics','Analytics'],['goals','Goals'],['settings','Settings']];
const TY={revision:['Revision','var(--pu)'],study:['Study session','var(--teal)'],exam:['Exam / deadline','var(--co)'],assign:['Assignment','var(--vio)']};
let S=load(),page=(location.hash||'#dashboard').slice(1),sem=S.settings.sem,opn={},cal={view:'month',d:today(),hide:{},sid:''};
function load(){const d0={subjects:[],sessions:[],events:[],tasks:[],goals:[],tracks:[],settings:{sem:3,target:4,theme:'dark'}};try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.subjects)return{...d0,...d,settings:{...d0.settings,...d.settings}}}catch(e){}return d0}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save: storage is full or blocked.')}}
const uid=()=>Math.random().toString(36).slice(2,10),pd=s=>new Date(s+'T12:00:00'),hrs=s=>(s/3600).toFixed(1)+'h';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return sdate()}
function addDays(d,n){const x=pd(d);x.setDate(x.getDate()+n);return dstr(x)}
const ws=d=>addDays(d,-((pd(d).getDay()+6)%7));
const secsOn=d=>S.sessions.filter(x=>x.date===d).reduce((a,x)=>a+x.secs,0);
function streak(){let n=0,d=today();if(!secsOn(d))d=addDays(d,-1);while(secsOn(d)>0){n++;d=addDays(d,-1)}return n}
const topicsOf=o=>o.units?o.units.flatMap(u=>u.topics):o.topics;
const leaf=t=>t.subs&&t.subs.length?t.subs:[t];
function pct(o){const t=topicsOf(o).flatMap(leaf);return t.length?Math.round(t.filter(x=>DONE.includes(x.status)).length/t.length*100):0}
const sf=id=>S.subjects.find(s=>s.id===id),sname=id=>{const s=sf(id);return s?s.name:''};
const subOpts=()=>[['','None'],...S.subjects.map(s=>[s.id,s.name+' (Sem '+s.sem+')'])];
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
/* modal */
function modal(title,fields=[],o={}){return new Promise(res=>{const w=document.createElement('div');w.className='ov';
w.innerHTML=`<form class="md" novalidate><h3>${esc(title)}</h3>${o.msg?`<p class="lbl" style="margin-bottom:10px">${esc(o.msg)}</p>`:''}${fields.map(f=>`<label class="fl">${esc(f.l)}${f.t==='select'?`<select name="${f.k}">${f.o.map(x=>`<option value="${esc(x[0])}" ${String(x[0])===String(f.v??'')?'selected':''}>${esc(x[1])}</option>`).join('')}</select>`:f.t==='textarea'?`<textarea name="${f.k}" rows="3">${esc(f.v??'')}</textarea>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v??'')}" ${f.t==='number'?'step="any" inputmode="decimal"':''}>`}</label>`).join('')}<div class="err" hidden></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button type="button" class="btn ghost" data-a="x">Cancel</button>${(o.extra||[]).map(x=>`<button type="button" class="btn ${x[2]||'ghost'}" data-a="${x[0]}">${x[1]}</button>`).join('')}<button class="btn" type="submit">${o.ok||'Save'}</button></div></form>`;
document.body.appendChild(w);const f=w.firstChild,kd=e=>{if(e.key==='Escape')close(null)},close=v=>{w.remove();document.removeEventListener('keydown',kd);res(v)};document.addEventListener('keydown',kd);
const bad=m=>{const er=f.querySelector('.err');er.hidden=false;er.textContent=m};
w.onclick=e=>{if(e.target===w)close(null);const a=e.target.dataset&&e.target.dataset.a;if(a)close(a==='x'?null:{__act:a})};
f.onsubmit=e=>{e.preventDefault();const v={};for(const x of fields){v[x.k]=f.elements[x.k].value.trim();if(x.r&&!v[x.k])return bad(x.l+' is required.')}const m=o.check&&o.check(v);if(m)return bad(m);close(v)};
const i=f.querySelector('input,select');i&&i.focus()})}
const sure=async(m,ok='Delete')=>(await modal('Please confirm',[],{msg:m,ok}))!==null;
/* nav */
const IC={dashboard:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',academics:'<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2.5 9 2.5 12 0v-5"/>',planner:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/>',focus:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/>',exams:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 14l2 2 4-4"/>',analytics:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',goals:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',settings:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>'};
const svg=k=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
const navBtn=id=>`<button class="${id===page?'on':''}" onclick="go('${id}')" ${id===page?'aria-current="page"':''}>${svg(id)}<span>${PAGES.find(x=>x[0]===id)[1]}</span></button>`;
function navHTML(){const pc=Math.min(100,Math.round(secsOn(today())/(S.settings.target*3600)*100));
return `<div class="brand"><div class="logo">S</div><div class="bt"><b>Study OS</b><small>B.Tech academic tracker</small></div></div><div class="grp">Study</div>${['dashboard','night','today','academics','planner','focus'].map(navBtn).join('')}<div class="grp">Prepare</div>${['revision','cards','exams','gate'].map(navBtn).join('')}<div class="grp">Grow</div>${['skills','projects','da','career','goals'].map(navBtn).join('')}<div class="grp">Insights</div>${['analytics'].map(navBtn).join('')}<div class="foot">${navBtn('settings')}<div class="me"><b>Semester ${S.settings.sem}</b><div class="bar"><i style="width:${pc}%"></i></div><small>Today: ${pc}% of ${S.settings.target}h target</small></div></div>`}
function theme(){let t=S.settings.theme;if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t)}
function go(p){page=p;location.hash=p;render()}
function render(){try{render0()}catch(e){fail(e)}}
function fail(e){console.error(e);try{document.getElementById('nav').innerHTML=navHTML()}catch(x){}const m=document.getElementById('main');if(!m)return;m.innerHTML=`<div class="card"><h2>Something went wrong</h2><p class="lbl">Your data is safe in this browser. Page: ${esc(page)}. Error: ${esc((e&&e.message)||e)}</p><div class="row" style="margin-top:10px"><button class="btn" onclick="rawBackup()">Download my data</button><button class="btn ghost" onclick="go('dashboard')">Go to Dashboard</button></div><p class="lbl" style="margin-top:10px">Send this error text to get it fixed.</p></div>`}
function rawBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([localStorage.getItem(KEY)||'{}'],{type:'application/json'}));a.download='studyos-raw-backup.json';a.click()}
addEventListener('error',e=>{const m=document.getElementById('main');if(m&&!m.innerHTML.trim())fail(e.error||e.message)});
function render0(){theme();trk();try{autoAll()}catch(e){console.error(e)}document.getElementById('nav').innerHTML=navHTML();const t=PAGES.find(p=>p[0]===page);document.title=(t?t[1]:'Study OS')+' · Study OS';
const m=document.getElementById('main'),sc=m.dataset.p===page?m.scrollTop:0;
m.innerHTML=`<div class="tbar"><span class="num lbl" id="clk"></span><button class="btn ghost sm" onclick="alerts()" aria-label="Reminders">🔔 ${notifs().length}</button><button class="btn ghost sm" onclick="pal()">Search · Ctrl+K</button><button class="btn sm" onclick="quick()">+ Quick add</button></div>`+(V[page]||V.dashboard)();m.dataset.p=page;m.scrollTop=sc;clock();if(page==='focus')tick()}
function clock(){const c=document.getElementById('clk');if(c)c.textContent=new Date().toLocaleString(undefined,{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'})}
setInterval(clock,1000);
const V={};
/* dashboard */
V.dashboard=()=>{const d=today(),tt=secsOn(d),tg=S.settings.target*3600;let wk=0;for(let i=0;i<7;i++)wk+=secsOn(addDays(d,-i));
const tot=S.sessions.reduce((a,x)=>a+x.secs,0),all=S.subjects.flatMap(s=>topicsOf(s).flatMap(leaf)),dn=all.filter(x=>DONE.includes(x.status)).length,prog=all.length?Math.round(dn/all.length*100):0;
const rev=[];S.subjects.forEach(s=>topicsOf(s).forEach(t=>{if(t.status==='Revision Needed')rev.push(s.name+' · '+t.title)}));
const up=S.events.filter(e=>e.date>=d&&e.date<=addDays(d,14)&&!e.done).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6),tk=S.tasks.filter(t=>!t.done).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,5),rec=[...S.sessions].reverse().slice(0,5);
return `<h2>Dashboard</h2><p class="sub">${pd(d).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</p>
<div class="grid"><div class="card"><div class="lbl">Today</div><div class="big num">${hrs(tt)}</div><div class="lbl">Target ${S.settings.target}h · ${tt>=tg?'target reached':hrs(tg-tt)+' left'}</div><div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,tt/tg*100)}%"></i></div></div>
<div class="card"><div class="lbl">Last 7 days</div><div class="big num">${hrs(wk)}</div><div class="lbl">Total ${hrs(tot)}</div></div>
<div class="card"><div class="lbl">Study streak</div><div class="big num">${streak()} day${streak()===1?'':'s'}</div></div>
<div class="card"><div class="lbl">Syllabus completed</div><div class="big num">${prog}%</div><div class="lbl">${dn} of ${all.length} topics</div></div></div>
<div class="grid"><div class="card"><h3>Subject completion</h3>${S.subjects.length?S.subjects.map(s=>`<div class="item"><div class="row sp"><span>${esc(s.name)} <span class="tag">Sem ${s.sem}</span></span><span class="num">${pct(s)}%</span></div><div class="bar"><i style="width:${pct(s)}%"></i></div></div>`).join(''):'<div class="empty">No subjects yet. Use Quick add → Subject.</div>'}</div>
<div class="card"><h3>Upcoming (14 days)</h3>${up.length?up.map(e=>`<div class="item row sp" style="cursor:pointer" onclick="go('planner');cal.d='${e.date}';render()"><span><i class="tag" style="background:${TY[e.type][1]};color:#000">${TY[e.type][0]}</i> ${esc(e.title)}</span><span class="num lbl">${e.date.slice(5)}</span></div>`).join(''):'<div class="empty">Nothing scheduled.</div>'}</div>
<div class="card"><h3>Pending tasks</h3>${tk.length?tk.map(t=>`<div class="item row sp"><span>${esc(t.title)}</span><span class="num lbl" style="${t.due<d?'color:var(--co)':''}">${t.due.slice(5)}</span></div>`).join(''):'<div class="empty">No pending tasks.</div>'}</div>
<div class="card"><h3>Recent sessions</h3>${rec.length?rec.map(x=>`<div class="item row sp"><span>${esc(x.label)}</span><span class="num lbl">${x.date.slice(5)} · ${Math.round(x.secs/60)}m</span></div>`).join(''):'<div class="empty">No sessions logged. Start one in Focus.</div>'}</div>
<div class="card"><h3>Needs revision</h3>${rev.length?rev.slice(0,6).map(r=>`<div class="item">${esc(r)}</div>`).join(''):'<div class="empty">Nothing marked for revision.</div>'}</div></div>`};
/* academics */
V.academics=()=>{const subs=S.subjects.filter(s=>s.sem===sem);
return `<h2>My Academics</h2><p class="sub">Semester → Subject → Unit → Topic</p>
<div class="tabs">${[1,2,3,4,5,6,7,8].map(n=>`<button class="${n===sem?'on':''}" onclick="sem=${n};S.settings.sem=${n};save();render()">Sem ${n}</button>`).join('')}</div>
<div class="row" style="margin-bottom:14px"><button class="btn" onclick="addSub()">+ Add subject</button></div>
${subs.length?subs.map(s=>`<div class="card" style="margin-bottom:12px"><div class="row sp"><div><b>${esc(s.name)}</b> <span class="tag">${esc(s.code||'no code')}</span> <span class="tag">${s.credits??'–'} cr</span><div class="lbl">${s.units.length} units · ${topicsOf(s).length} topics · ${hrs(S.sessions.filter(x=>x.sid===s.id).reduce((a,x)=>a+x.secs,0))} studied</div></div><div class="row"><span class="num big" style="font-size:22px">${pct(s)}%</span><button class="btn ghost sm" onclick="opn['${s.id}']=!opn['${s.id}'];render()">${opn[s.id]?'Hide':'Open'}</button></div></div><div class="bar" style="margin-top:8px"><i style="width:${pct(s)}%"></i></div>
${opn[s.id]?`<div style="margin-top:12px"><div class="row" style="margin-bottom:8px"><button class="btn ghost sm" onclick="addUnit('${s.id}')">+ Unit</button><button class="btn danger sm" onclick="delSub('${s.id}')">Delete subject</button></div>
${s.units.length?s.units.map((u,i)=>`<div class="item"><div class="row sp"><b>Unit ${i+1}: ${esc(u.title)}</b><span class="num lbl">${pct({topics:u.topics})}%</span></div><div class="ind">${u.topics.map(t=>topicRow(s.id,u.id,t)).join('')}<div class="row" style="margin-top:6px"><button class="btn ghost sm" onclick="addTopic('${s.id}','${u.id}')">+ Topic</button><button class="btn ghost sm" onclick="delUnit('${s.id}','${u.id}')">Delete unit</button></div></div></div>`).join(''):'<div class="empty">No units yet. Add your first unit.</div>'}</div>`:''}</div>`).join(''):'<div class="empty">No subjects in this semester yet. Tap “Add subject”.</div>'}`};
async function addSub(){const r=await modal('New subject (Sem '+sem+')',[{k:'n',l:'Subject name',r:1},{k:'c',l:'Subject code (optional)'},{k:'cr',l:'Credits (optional)',t:'number'}],{check:v=>v.cr&&+v.cr<0?'Credits cannot be negative.':''});if(!r)return;S.subjects.push({id:uid(),name:r.n,code:r.c,credits:r.cr?+r.cr:null,sem,units:[]});save();render();toast('Subject added')}
async function delSub(id){const s=sf(id);if(await sure(`Delete "${s.name}" with ${s.units.length} units and ${topicsOf(s).length} topics? Logged sessions stay in your history.`)){S.subjects=S.subjects.filter(x=>x.id!==id);save();render()}}
async function addUnit(id){const r=await modal('New unit',[{k:'t',l:'Unit title',r:1}]);if(!r)return;sf(id).units.push({id:uid(),title:r.t,topics:[]});save();render()}
async function delUnit(s,u){const un=sf(s).units.find(x=>x.id===u);if(await sure(`Delete this unit and its ${un.topics.length} topics?`)){sf(s).units=sf(s).units.filter(x=>x.id!==u);save();render()}}
async function addTopic(s,u){const r=await modal('New topic',[{k:'t',l:'Topic title',r:1},{k:'s',l:'Status',t:'select',o:STAT.map(x=>[x,x])}]);if(!r)return;sf(s).units.find(x=>x.id===u).topics.push({id:uid(),title:r.t,status:r.s});save();render()}
async function delTopic(s,u,t){const un=sf(s).units.find(x=>x.id===u);if(await sure('Delete this topic?')){un.topics=un.topics.filter(x=>x.id!==t);save();render()}}
const stSel=(a,v)=>`<select onchange="${a}">${STAT.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;
function topicRow(s,u,t){const sb=t.subs||[],dn=sb.filter(x=>DONE.includes(x.status)).length;
return `<div style="padding:4px 0"><div class="row sp"><span>${esc(t.title)}${sb.length?` <span class="tag">${dn}/${sb.length} subtopics</span>`:''}</span><span class="row">${sb.length?'':stSel(`setStat('${s}','${u}','${t.id}',this.value)`,t.status)}<button class="btn ghost sm" onclick="addSubt('${s}','${u}','${t.id}')">+ Subtopic</button><button class="btn ghost sm" aria-label="Delete topic" onclick="delTopic('${s}','${u}','${t.id}')">✕</button></span></div>${sb.length?`<div class="ind">${sb.map(x=>`<div class="row sp" style="padding:3px 0"><span class="lbl">${esc(x.title)}</span><span class="row">${stSel(`setSub('${s}','${u}','${t.id}','${x.id}',this.value)`,x.status)}<button class="btn ghost sm" aria-label="Delete subtopic" onclick="delSubt('${s}','${u}','${t.id}','${x.id}')">✕</button></span></div>`).join('')}</div>`:''}</div>`}
const findT=(s,u,t)=>sf(s).units.find(x=>x.id===u).topics.find(x=>x.id===t);
async function addSubt(s,u,t){const r=await modal('New subtopic',[{k:'t',l:'Subtopic title',r:1},{k:'s',l:'Status',t:'select',o:STAT.map(x=>[x,x])}]);if(!r)return;const tp=findT(s,u,t);(tp.subs=tp.subs||[]).push({id:uid(),title:r.t,status:r.s});save();render()}
function setSub(s,u,t,id,v){findT(s,u,t).subs.find(x=>x.id===id).status=v;save();render()}
async function delSubt(s,u,t,id){if(await sure('Delete this subtopic?')){const tp=findT(s,u,t);tp.subs=tp.subs.filter(x=>x.id!==id);save();render()}}
function setStat(s,u,t,v){sf(s).units.find(x=>x.id===u).topics.find(x=>x.id===t).status=v;save();render()}
/* tasks & events */
async function addTask(){const r=await modal('New task',[{k:'t',l:'Task',r:1},{k:'due',l:'Due date',t:'date',v:cal.d,r:1},{k:'p',l:'Priority',t:'select',o:[['Medium','Medium'],['High','High'],['Low','Low']]},{k:'sid',l:'Subject',t:'select',o:subOpts()}]);if(!r)return;S.tasks.push({id:uid(),title:r.t,due:r.due,prio:r.p,sid:r.sid,done:false});save();render();toast('Task added')}
function togTask(id){const t=S.tasks.find(x=>x.id===id);t.done=!t.done;save();render()}
async function delTask(id){if(await sure('Delete this task?')){S.tasks=S.tasks.filter(x=>x.id!==id);save();render()}}
async function carry(){const od=S.tasks.filter(t=>!t.done&&t.due<today());if(od.length&&await sure(`Move ${od.length} unfinished task${od.length>1?'s':''} to today? Only task due dates change.`,'Move to today')){od.forEach(t=>t.due=today());save();render();toast('Tasks moved to today')}}
const tm=t=>{const[a,b]=t.split(':');return +a*60+ +b},fm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const evFields=(e={})=>[{k:'t',l:'Title',r:1,v:e.title},{k:'ty',l:'Type',t:'select',v:e.type||'study',o:Object.entries(TY).map(([k,v])=>[k,v[0]])},{k:'d',l:'Date',t:'date',r:1,v:e.date||cal.d},{k:'s',l:'Start time (optional)',t:'time',v:e.start},{k:'e',l:'End time (optional)',t:'time',v:e.end},{k:'sid',l:'Subject',t:'select',v:e.sid,o:subOpts()}];
const evCheck=v=>v.e&&!v.s?'Add a start time or clear the end time.':v.s&&v.e&&v.e<=v.s?'End time must be after the start time.':'';
async function addEv(pre={}){const f=evFields(pre);f.push({k:'rp',l:'Repeat',t:'select',o:[['','Does not repeat'],['d','Daily for 14 days'],['w','Weekly for 12 weeks']]});
const r=await modal('New event',f,{check:evCheck});if(!r)return;const n=r.rp==='d'?14:r.rp==='w'?12:1,st=r.rp==='d'?1:7,g=uid();
for(let i=0;i<n;i++)S.events.push({id:uid(),g:n>1?g:null,title:r.t,type:r.ty,date:addDays(r.d,i*st),start:r.s,end:r.e,sid:r.sid,done:false});
cal.d=r.d;save();render();toast(n>1?n+' events added':'Event added')}
async function editEv(id){const e=S.events.find(x=>x.id===id),f=evFields(e);if(e.type==='exam'){f.push({k:'mx',l:'Maximum marks',t:'number',v:e.max},{k:'gt',l:'Marks obtained',t:'number',v:e.got})}
const r=await modal('Edit event',f,{ok:'Save',check:v=>evCheck(v)||(v.gt&&v.mx&&+v.gt>+v.mx?'Marks obtained cannot exceed maximum marks.':''),extra:[['del','Delete','danger'],['done',e.done?'Mark not done':'Mark done']]});if(!r)return;
if(r.__act==='del'){if(await sure(e.g?'Delete this event? Other repeats stay.':'Delete this event?')){S.events=S.events.filter(x=>x.id!==id);save();render()}return}
if(r.__act==='done'){e.done=!e.done}else Object.assign(e,{title:r.t,type:r.ty,date:r.d,start:r.s,end:r.e,sid:r.sid},e.type==='exam'?{max:r.mx?+r.mx:null,got:r.gt?+r.gt:null}:{});save();render()}
function drag(ev,id){ev.dataTransfer.setData('text/plain',id)}
function dropEv(ev,d){ev.preventDefault();const e=S.events.find(x=>x.id===ev.dataTransfer.getData('text/plain'));if(e&&e.date!==d){e.date=d;save();render();toast('Moved to '+d)}}
/* calendar */
const evs=d=>S.events.filter(e=>e.date===d&&!cal.hide[e.type]&&(!cal.sid||e.sid===cal.sid)).sort((a,b)=>(a.start||'').localeCompare(b.start||''));
const col=e=>e.done?'var(--lime)':TY[e.type][1];
const chip=e=>`<div class="ev" draggable="true" ondragstart="drag(event,'${e.id}')" onclick="event.stopPropagation();editEv('${e.id}')" style="--c:${col(e)}" title="${esc(e.title)}">${e.done?'✓ ':''}${e.start?e.start+' ':''}${esc(e.title)}</div>`;
function calTitle(){const d=pd(cal.d);if(cal.view==='month')return d.toLocaleDateString(undefined,{month:'long',year:'numeric'});if(cal.view==='day')return d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});if(cal.view==='agenda')return 'Next 45 days';const a=ws(cal.d);return pd(a).toLocaleDateString(undefined,{day:'numeric',month:'short'})+' – '+pd(addDays(a,6)).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function calMove(n){const d=pd(cal.d);if(cal.view==='month')d.setMonth(d.getMonth()+n,1);else d.setDate(d.getDate()+n*(cal.view==='day'?1:cal.view==='week'?7:45));cal.d=dstr(d);render()}
function month(){const d=pd(cal.d),m=d.getMonth(),a=ws(dstr(new Date(d.getFullYear(),m,1)));let h='<div class="mg">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<b>${x}</b>`).join('');
for(let i=0;i<42;i++){const ds=addDays(a,i),es=evs(ds),s=secsOn(ds);h+=`<div class="mc ${pd(ds).getMonth()!==m?'o':''} ${ds===cal.d?'sel':''} ${ds===today()?'today':''}" ondragover="event.preventDefault()" ondrop="dropEv(event,'${ds}')" onclick="cal.d='${ds}';render()"><div class="row sp"><span class="dn num">${pd(ds).getDate()}</span>${s?`<span class="num" style="font-size:10px;color:var(--teal)">${hrs(s)}</span>`:''}</div>${es.slice(0,3).map(chip).join('')}${es.length>3?`<div class="lbl" style="font-size:11px">+${es.length-3} more</div>`:''}</div>`}
return h+'</div>'}
function gcl(ev,d){const m=Math.floor(ev.offsetY/44*2)*30+360;addEv({date:d,start:fm(Math.min(m,22*60))})}
function grid(days){const H0=6,H1=23,PX=44,H=(H1-H0)*PX;
let h=`<div class="tgw"><div class="tcol"><div class="th"></div><div style="position:relative;height:${H}px">${Array.from({length:H1-H0},(_,i)=>`<span class="lbl num" style="position:absolute;top:${i*PX}px;right:4px;font-size:10px">${String(H0+i).padStart(2,'0')}</span>`).join('')}</div></div>`;
for(const d of days){const es=evs(d);h+=`<div class="tcol"><div class="th ${d===today()?'tdy':''}">${pd(d).toLocaleDateString(undefined,{weekday:'short',day:'numeric'})}${es.filter(e=>!e.start).map(chip).join('')}</div><div class="tb2" style="height:${H}px" ondragover="event.preventDefault()" ondrop="dropEv(event,'${d}')" onclick="gcl(event,'${d}')">`;
const pos=(a,b)=>`top:${Math.max(0,(a-H0*60)/60*PX)}px;height:${Math.max(20,(b-a)/60*PX)}px`;
for(const e of es.filter(e=>e.start)){const a=tm(e.start);h+=`<div class="blk" draggable="true" ondragstart="drag(event,'${e.id}')" onclick="event.stopPropagation();editEv('${e.id}')" style="--c:${col(e)};${pos(a,e.end?tm(e.end):a+60)}">${e.done?'✓ ':''}${esc(e.title)}<br><span class="num">${e.start}</span></div>`}
for(const x of S.sessions.filter(x=>x.date===d&&x.start)){const a=tm(x.start);h+=`<div class="blk ses" style="--c:var(--teal);${pos(a,a+Math.round(x.secs/60))}">Focus ${Math.round(x.secs/60)}m</div>`}
if(d===today()){const n=new Date();h+=`<div class="now" style="top:${(n.getHours()*60+n.getMinutes()-H0*60)/60*PX}px"></div>`}
h+='</div></div>'}
return h+'</div>'}
function agenda(){let h='';for(let i=0;i<45;i++){const d=addDays(cal.d,i),es=evs(d),ts=S.tasks.filter(t=>t.due===d&&!t.done);if(!es.length&&!ts.length)continue;h+=`<div class="item"><b>${pd(d).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'})}</b>${es.map(chip).join('')}${ts.map(t=>`<div class="lbl" style="margin-top:3px">☐ ${esc(t.title)}</div>`).join('')}</div>`}
return h||'<div class="empty">Nothing scheduled in the next 45 days.</div>'}
function taskPanel(){const ts=[...S.tasks].sort((a,b)=>(a.done-b.done)||a.due.localeCompare(b.due)),od=S.tasks.filter(t=>!t.done&&t.due<today()).length,pc={High:'var(--co)',Medium:'#F4C56A',Low:'var(--teal)'};
return `<div class="row sp" style="margin-bottom:10px"><h3>Tasks</h3><button class="btn sm" onclick="addTask()">+ Task</button></div>${od?`<button class="btn ghost sm" style="margin-bottom:8px" onclick="carry()">Carry forward ${od} overdue</button>`:''}${ts.length?ts.map(t=>`<div class="item row sp" style="flex-wrap:nowrap"><label class="row" style="flex:1;gap:8px;flex-wrap:nowrap"><input type="checkbox" ${t.done?'checked':''} onchange="togTask('${t.id}')"><span style="${t.done?'text-decoration:line-through;opacity:.5':''}"><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${pc[t.prio]||pc.Medium};margin-right:6px"></i>${esc(t.title)}</span></label><span class="tag num" style="${!t.done&&t.due<today()?'color:var(--co)':''}">${t.due.slice(5)}</span><button class="btn ghost sm" aria-label="Delete task" onclick="delTask('${t.id}')">✕</button></div>`).join(''):'<div class="empty">No tasks yet. Add one and it will appear on the calendar agenda.</div>'}`}
function dayPanel(){const d=cal.d,es=S.events.filter(e=>e.date===d),ss=S.sessions.filter(x=>x.date===d),ts=S.tasks.filter(t=>t.due===d),n=es.length+ts.length,dn=es.filter(e=>e.done).length+ts.filter(t=>t.done).length,pc=n?Math.round(dn/n*100):0;
const it=[...es.map(e=>[e.start||'99',`<div class="item row sp" style="cursor:pointer" onclick="editEv('${e.id}')"><span><i class="tag" style="background:${col(e)};color:#000">${e.done?'Done':TY[e.type][0]}</i> ${esc(e.title)}${e.sid?` <span class="lbl">· ${esc(sname(e.sid))}</span>`:''}</span><span class="num lbl">${e.start||'all day'}</span></div>`]),...ss.map(x=>[x.start||'98',`<div class="item row sp"><span><i class="tag" style="background:var(--teal);color:#000">Focus</i> ${esc(x.label)}</span><span class="num lbl">${x.start}–${x.end} · ${Math.round(x.secs/60)}m</span></div>`]),...ts.map(t=>['97',`<div class="item row sp"><span>${t.done?'☑':'☐'} ${esc(t.title)}</span><span class="tag">${t.prio}</span></div>`])].sort((a,b)=>a[0].localeCompare(b[0]));
return `<div class="card"><div class="row sp" style="margin-bottom:10px"><h3>${pd(d).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</h3><button class="btn sm" onclick="addEv({date:'${d}'})">+ Event</button></div>
<div class="grid" style="grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px"><div><div class="num big" style="font-size:20px">${hrs(secsOn(d))}</div><div class="lbl">studied</div></div><div><div class="num big" style="font-size:20px">${ss.length}</div><div class="lbl">focus</div></div><div><div class="num big" style="font-size:20px">${es.length}</div><div class="lbl">events</div></div><div><div class="num big" style="font-size:20px">${ts.length}</div><div class="lbl">tasks due</div></div></div>
<div class="row sp lbl"><span>Day progress</span><span class="num">${n?dn+'/'+n+' done':'–'}</span></div><div class="bar" style="margin:4px 0 8px"><i style="width:${pc}%"></i></div>${it.length?it.map(x=>x[1]).join(''):'<div class="empty">Nothing on this day. Tap + Event, or tap the time grid in Week / Day view.</div>'}</div>`}
function miniStats(){const d=pd(cal.d),y=d.getFullYear(),m=d.getMonth(),n=new Date(y,m+1,0).getDate(),v=[];for(let i=1;i<=n;i++)v.push(secsOn(dstr(new Date(y,m,i))));const mx=Math.max(...v,1),tot=v.reduce((a,b)=>a+b,0);
const me=S.events.filter(e=>e.date.startsWith(dstr(new Date(y,m,1)).slice(0,7)));
return `<div class="card"><div class="row sp"><h3>This month</h3><span class="num lbl">${hrs(tot)} studied · ${me.length} events · ${me.filter(e=>e.done).length} done</span></div><div class="bars" style="height:70px;gap:3px">${v.map((s,i)=>`<div title="${i+1}: ${hrs(s)}"><i style="height:${s/mx*100}%;${s?'':'opacity:.25'}"></i></div>`).join('')}</div></div>`}
V.planner=()=>{const body=cal.view==='month'?month():cal.view==='week'?grid([0,1,2,3,4,5,6].map(i=>addDays(ws(cal.d),i))):cal.view==='day'?grid([cal.d]):agenda();
return `<h2>Study Planner</h2><p class="sub">Drag events between days. Tap the time grid in Week or Day view to add at that time.</p><div class="pl"><div class="card">${taskPanel()}</div><div class="stack"><div class="card">
<div class="row sp" style="margin-bottom:10px"><div class="tabs" style="margin:0">${['month','week','day','agenda'].map(v=>`<button class="${v===cal.view?'on':''}" onclick="cal.view='${v}';render()">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div><div class="row"><button class="btn ghost sm" onclick="calMove(-1)" aria-label="Previous">‹</button><button class="btn ghost sm" onclick="cal.d=today();render()">Today</button><button class="btn ghost sm" onclick="calMove(1)" aria-label="Next">›</button></div></div>
<div class="row sp" style="margin-bottom:10px"><b style="font-size:17px">${calTitle()}</b><select onchange="cal.sid=this.value;render()" aria-label="Subject filter">${[['','All subjects'],...S.subjects.map(s=>[s.id,s.name])].map(x=>`<option value="${esc(x[0])}" ${x[0]===cal.sid?'selected':''}>${esc(x[1])}</option>`).join('')}</select></div>
