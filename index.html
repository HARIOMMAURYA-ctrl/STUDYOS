<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study OS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<style>
:root{--bg:#000000;--card:#000000;--el:#161616;--bd:#2b2b2b;--tx:#FFFFFF;--tx2:#a8a8a8;--pu:#ff0000;--vi:#ff4d4d;--teal:#36C9C1;--lime:#C7F36B;--co:#ff9f1a;--vio:#7aa7ff;--g:#ff0000;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f5f5f5;--card:#fff;--el:#eeeeee;--bd:#dddddd;--tx:#111111;--tx2:#666666;--pu:#e00000;--vi:#e00000;--teal:#1BA39B;--lime:#6FA32A;--co:#d97706;--vio:#3b6fd9;--g:#e60000;color-scheme:light}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.45 Manrope,Inter,system-ui,sans-serif;display:flex}
button,select,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--vi);outline-offset:2px}
.num{font-family:"JetBrains Mono",ui-monospace,monospace}
nav{width:244px;background:#ff0000;color:#fff;padding:16px 12px;display:flex;flex-direction:column;gap:2px;flex-shrink:0;overflow-y:auto;border-right:1px solid #00000040}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 18px}
.logo{width:38px;height:38px;border-radius:11px;background:#000;display:grid;place-items:center;font-weight:800;font-size:19px;box-shadow:0 4px 14px #0006,inset 0 1px #ffffff55;flex-shrink:0}
.bt{display:flex;flex-direction:column;line-height:1.2}.bt b{font-size:16px}.bt small{opacity:.65;font-size:12px}
.grp{font-size:12px;color:#FFD6D6;padding:14px 10px 6px}
nav button{position:relative;color:#fff;text-align:left;padding:10px 12px;border-radius:11px;display:flex;gap:12px;align-items:center;font-size:14.5px;transition:background .15s}
nav button:hover{background:#00000026;color:#fff}nav button.on{background:#00000047;color:#fff;font-weight:700}
nav button.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:#fff}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:14px}
.me{background:#00000040;border:1px solid #00000040;border-radius:14px;padding:12px;font-size:13px}.me b{display:block;margin-bottom:8px}.me small{display:block;margin-top:6px;opacity:.7;font-size:12px}.me .bar{background:#00000060}.me .bar i{background:#fff}
main{flex:1;overflow:auto;padding:18px 26px 40px;min-width:0}
h2{font-size:26px;margin-bottom:4px}h3{font-size:15px}.sub{color:var(--tx2);margin-bottom:16px}
.tbar{display:flex;justify-content:flex-end;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px}.card h3{margin-bottom:10px}
.big{font-size:30px;font-weight:700}.lbl{color:var(--tx2);font-size:13px}
.empty{color:var(--tx2);border:1px dashed var(--bd);border-radius:14px;padding:16px;font-size:14px}
.btn{background:var(--g);color:#fff;padding:9px 16px;border-radius:12px;font-weight:700}.btn.ghost{background:var(--el);color:var(--tx)}.btn.danger{background:var(--co);color:#000}.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.bar{height:8px;border-radius:6px;background:var(--el);overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
textarea{background:var(--el);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;width:100%;resize:vertical}
select,input{background:var(--el);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;min-width:0}
.item{padding:10px 0;border-top:1px solid var(--bd)}.item:first-child{border-top:0}
.ind{margin-left:16px;border-left:2px solid var(--bd);padding-left:12px}
.tag{font-size:12px;padding:2px 8px;border-radius:20px;background:var(--el);color:var(--tx2)}
.timer{font-size:64px;font-weight:700;text-align:center;margin:14px 0;letter-spacing:2px}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tabs button{padding:6px 14px;border-radius:20px;background:var(--el);white-space:nowrap}.tabs .on{background:var(--g);color:#fff}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px;overflow:auto;padding-bottom:6px}.heat i{width:14px;height:14px;border-radius:3px;background:var(--el)}
.bars{display:flex;gap:10px;align-items:flex-end;height:150px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--tx2);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bars i{display:block;background:var(--g);border-radius:6px 6px 0 0;min-height:2px;margin-bottom:4px}
.pl{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;align-items:start}.stack>*+*{margin-top:14px}
.ev{--c:var(--pu);font-size:11.5px;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--c) 24%,transparent);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;margin-top:3px}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.mg>b{text-align:center;font-size:12px;color:var(--tx2)}
.mc{min-height:100px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:6px;cursor:pointer;overflow:hidden}
.mc.o{opacity:.4}.mc.sel{border-color:var(--vi);box-shadow:0 0 0 1px var(--vi)}.mc.today .dn{background:var(--g);color:#fff}
.dn{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;font-size:12px}
.tgw{display:flex;border:1px solid var(--bd);border-radius:14px;overflow:auto;max-height:640px;background:var(--bg)}
.tcol{flex:1;min-width:96px;border-left:1px solid var(--bd)}.tcol:first-child{border-left:0;flex:0 0 40px;min-width:40px}
.th{height:58px;padding:4px;text-align:center;font-size:12px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--card);z-index:3;overflow:hidden}.th.tdy{color:var(--vi);font-weight:700}
.tb2{position:relative;background-image:linear-gradient(var(--bd) 1px,transparent 1px);background-size:100% 44px}
.blk{--c:var(--pu);position:absolute;left:2px;right:2px;border-radius:7px;padding:2px 5px;font-size:11px;overflow:hidden;background:color-mix(in srgb,var(--c) 32%,var(--card));border-left:3px solid var(--c);cursor:pointer;z-index:1}
.blk.ses{pointer-events:none;opacity:.85}.now{position:absolute;left:0;right:0;height:2px;background:var(--co);z-index:2;pointer-events:none}
.leg{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:20px;background:var(--el);font-size:12px}.leg i{width:9px;height:9px;border-radius:50%;background:var(--c)}.leg.off{opacity:.4}
.ov{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:14px}
.md{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;width:min(440px,100%);max-height:90vh;overflow:auto}.md h3{font-size:17px;margin-bottom:12px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--tx2);margin-bottom:10px}.err{color:var(--co);font-size:13px}
.pal{width:min(560px,100%);align-self:start;margin-top:10vh}.pal input{width:100%;margin-bottom:8px}.pal button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:9px 10px;border-radius:10px}.pal button:hover,.pal button.f{background:var(--el)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--el);border:1px solid var(--bd);padding:10px 16px;border-radius:12px;z-index:60}
@media(max-width:900px){.pl{grid-template-columns:1fr}}
@media(max-width:760px){nav{width:70px;padding:10px 6px}.brand{justify-content:center;padding:2px 0 10px}.bt,.me{display:none}.grp{font-size:0;padding:0;margin:6px 10px;border-top:1px solid #00000050}
nav button{flex-direction:column;gap:3px;font-size:10px;padding:8px 2px;align-items:center;text-align:center}nav button.on::before{left:-6px}
main{padding:14px 12px 24px}.timer{font-size:52px}.mc{min-height:62px;padding:3px}.mc .ev{font-size:0;height:5px;padding:0}.mg{gap:3px}}
</style></head><body>
<nav id="nav"></nav><main id="main"></main>
<script>
const KEY='studyos_v1',STAT=['Not Started','Planned','Learning','Partially Completed','Completed','Revision Needed','Mastered'],DONE=['Completed','Mastered'];
const PAGES=[['dashboard','Dashboard'],['academics','Academics'],['planner','Planner'],['focus','Focus'],['exams','Exams'],['analytics','Analytics'],['goals','Goals'],['settings','Settings']];
const TY={revision:['Revision','var(--pu)'],study:['Study session','var(--teal)'],exam:['Exam / deadline','var(--co)'],assign:['Assignment','var(--vio)']};
let S=load(),page=(location.hash||'#dashboard').slice(1),sem=S.settings.sem,opn={},cal={view:'month',d:today(),hide:{},sid:''};
function load(){const d0={subjects:[],sessions:[],events:[],tasks:[],goals:[],tracks:[],settings:{sem:3,target:4,theme:'dark'}};try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.subjects)return{...d0,...d,settings:{...d0.settings,...d.settings}}}catch(e){}return d0}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save: storage is full or blocked.')}}
const uid=()=>Math.random().toString(36).slice(2,10),pd=s=>new Date(s+'T12:00:00'),hrs=s=>(s/3600).toFixed(1)+'h';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return dstr(new Date())}
function addDays(d,n){const x=pd(d);x.setDate(x.getDate()+n);return dstr(x)}
const ws=d=>addDays(d,-((pd(d).getDay()+6)%7));
const secsOn=d=>S.sessions.filter(x=>x.date===d).reduce((a,x)=>a+x.secs,0);
function streak(){let n=0,d=today();if(!secsOn(d))d=addDays(d,-1);while(secsOn(d)>0){n++;d=addDays(d,-1)}return n}
const topicsOf=o=>o.units?o.units.flatMap(u=>u.topics):o.topics;
const leaf=t=>t.subs&&t.subs.length?t.subs:[t];
function pct(o){const t=topicsOf(o).flatMap(leaf);return t.length?Math.round(t.filter(x=>DONE.includes(x.status)).length/t.length*100):0}
const sf=id=>S.subjects.find(s=>s.id===id),sname=id=>{const s=sf(id);return s?s.name:''};
const subOpts=()=>[['','None'],...S.subjects.map(s=>[s.id,s.name+' (Sem '+s.sem+')'])];
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
/* modal */
function modal(title,fields=[],o={}){return new Promise(res=>{const w=document.createElement('div');w.className='ov';
w.innerHTML=`<form class="md" novalidate><h3>${esc(title)}</h3>${o.msg?`<p class="lbl" style="margin-bottom:10px">${esc(o.msg)}</p>`:''}${fields.map(f=>`<label class="fl">${esc(f.l)}${f.t==='select'?`<select name="${f.k}">${f.o.map(x=>`<option value="${esc(x[0])}" ${String(x[0])===String(f.v??'')?'selected':''}>${esc(x[1])}</option>`).join('')}</select>`:f.t==='textarea'?`<textarea name="${f.k}" rows="3">${esc(f.v??'')}</textarea>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v??'')}" ${f.t==='number'?'step="any" inputmode="decimal"':''}>`}</label>`).join('')}<div class="err" hidden></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button type="button" class="btn ghost" data-a="x">Cancel</button>${(o.extra||[]).map(x=>`<button type="button" class="btn ${x[2]||'ghost'}" data-a="${x[0]}">${x[1]}</button>`).join('')}<button class="btn" type="submit">${o.ok||'Save'}</button></div></form>`;
document.body.appendChild(w);const f=w.firstChild,kd=e=>{if(e.key==='Escape')close(null)},close=v=>{w.remove();document.removeEventListener('keydown',kd);res(v)};document.addEventListener('keydown',kd);
const bad=m=>{const er=f.querySelector('.err');er.hidden=false;er.textContent=m};
w.onclick=e=>{if(e.target===w)close(null);const a=e.target.dataset&&e.target.dataset.a;if(a)close(a==='x'?null:{__act:a})};
f.onsubmit=e=>{e.preventDefault();const v={};for(const x of fields){v[x.k]=f.elements[x.k].value.trim();if(x.r&&!v[x.k])return bad(x.l+' is required.')}const m=o.check&&o.check(v);if(m)return bad(m);close(v)};
const i=f.querySelector('input,select');i&&i.focus()})}
const sure=async(m,ok='Delete')=>(await modal('Please confirm',[],{msg:m,ok}))!==null;
/* nav */
const IC={dashboard:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',academics:'<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2.5 9 2.5 12 0v-5"/>',planner:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/>',focus:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/>',exams:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 14l2 2 4-4"/>',analytics:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',goals:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',settings:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>'};
const svg=k=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
const navBtn=id=>`<button class="${id===page?'on':''}" onclick="go('${id}')" ${id===page?'aria-current="page"':''}>${svg(id)}<span>${PAGES.find(x=>x[0]===id)[1]}</span></button>`;
function navHTML(){const pc=Math.min(100,Math.round(secsOn(today())/(S.settings.target*3600)*100));
return `<div class="brand"><div class="logo">S</div><div class="bt"><b>Study OS</b><small>B.Tech academic tracker</small></div></div><div class="grp">Study</div>${['dashboard','today','academics','planner','focus'].map(navBtn).join('')}<div class="grp">Prepare</div>${['revision','exams','gate'].map(navBtn).join('')}<div class="grp">Grow</div>${['skills','projects','career','goals'].map(navBtn).join('')}<div class="grp">Insights</div>${['analytics'].map(navBtn).join('')}<div class="foot">${navBtn('settings')}<div class="me"><b>Semester ${S.settings.sem}</b><div class="bar"><i style="width:${pc}%"></i></div><small>Today: ${pc}% of ${S.settings.target}h target</small></div></div>`}
function theme(){let t=S.settings.theme;if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t)}
function go(p){page=p;location.hash=p;render()}
function render(){theme();trk();document.getElementById('nav').innerHTML=navHTML();const t=PAGES.find(p=>p[0]===page);document.title=(t?t[1]:'Study OS')+' · Study OS';
const m=document.getElementById('main'),sc=m.dataset.p===page?m.scrollTop:0;
m.innerHTML=`<div class="tbar"><span class="num lbl" id="clk"></span><button class="btn ghost sm" onclick="alerts()" aria-label="Reminders">🔔 ${notifs().length}</button><button class="btn ghost sm" onclick="pal()">Search · Ctrl+K</button><button class="btn sm" onclick="quick()">+ Quick add</button></div>`+(V[page]||V.dashboard)();m.dataset.p=page;m.scrollTop=sc;clock();if(page==='focus')tick()}
function clock(){const c=document.getElementById('clk');if(c)c.textContent=new Date().toLocaleString(undefined,{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'})}
setInterval(clock,1000);
const V={};
/* dashboard */
V.dashboard=()=>{const d=today(),tt=secsOn(d),tg=S.settings.target*3600;let wk=0;for(let i=0;i<7;i++)wk+=secsOn(addDays(d,-i));
const tot=S.sessions.reduce((a,x)=>a+x.secs,0),all=S.subjects.flatMap(s=>topicsOf(s).flatMap(leaf)),dn=all.filter(x=>DONE.includes(x.status)).length,prog=all.length?Math.round(dn/all.length*100):0;
const rev=[];S.subjects.forEach(s=>topicsOf(s).forEach(t=>{if(t.status==='Revision Needed')rev.push(s.name+' · '+t.title)}));
const up=S.events.filter(e=>e.date>=d&&e.date<=addDays(d,14)&&!e.done).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6),tk=S.tasks.filter(t=>!t.done).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,5),rec=[...S.sessions].reverse().slice(0,5);
return `<h2>Dashboard</h2><p class="sub">${pd(d).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</p>
<div class="grid"><div class="card"><div class="lbl">Today</div><div class="big num">${hrs(tt)}</div><div class="lbl">Target ${S.settings.target}h · ${tt>=tg?'target reached':hrs(tg-tt)+' left'}</div><div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,tt/tg*100)}%"></i></div></div>
<div class="card"><div class="lbl">Last 7 days</div><div class="big num">${hrs(wk)}</div><div class="lbl">Total ${hrs(tot)}</div></div>
<div class="card"><div class="lbl">Study streak</div><div class="big num">${streak()} day${streak()===1?'':'s'}</div></div>
<div class="card"><div class="lbl">Syllabus completed</div><div class="big num">${prog}%</div><div class="lbl">${dn} of ${all.length} topics</div></div></div>
<div class="grid"><div class="card"><h3>Subject completion</h3>${S.subjects.length?S.subjects.map(s=>`<div class="item"><div class="row sp"><span>${esc(s.name)} <span class="tag">Sem ${s.sem}</span></span><span class="num">${pct(s)}%</span></div><div class="bar"><i style="width:${pct(s)}%"></i></div></div>`).join(''):'<div class="empty">No subjects yet. Use Quick add → Subject.</div>'}</div>
<div class="card"><h3>Upcoming (14 days)</h3>${up.length?up.map(e=>`<div class="item row sp" style="cursor:pointer" onclick="go('planner');cal.d='${e.date}';render()"><span><i class="tag" style="background:${TY[e.type][1]};color:#000">${TY[e.type][0]}</i> ${esc(e.title)}</span><span class="num lbl">${e.date.slice(5)}</span></div>`).join(''):'<div class="empty">Nothing scheduled.</div>'}</div>
<div class="card"><h3>Pending tasks</h3>${tk.length?tk.map(t=>`<div class="item row sp"><span>${esc(t.title)}</span><span class="num lbl" style="${t.due<d?'color:var(--co)':''}">${t.due.slice(5)}</span></div>`).join(''):'<div class="empty">No pending tasks.</div>'}</div>
<div class="card"><h3>Recent sessions</h3>${rec.length?rec.map(x=>`<div class="item row sp"><span>${esc(x.label)}</span><span class="num lbl">${x.date.slice(5)} · ${Math.round(x.secs/60)}m</span></div>`).join(''):'<div class="empty">No sessions logged. Start one in Focus.</div>'}</div>
<div class="card"><h3>Needs revision</h3>${rev.length?rev.slice(0,6).map(r=>`<div class="item">${esc(r)}</div>`).join(''):'<div class="empty">Nothing marked for revision.</div>'}</div></div>`};
/* academics */
V.academics=()=>{const subs=S.subjects.filter(s=>s.sem===sem);
return `<h2>My Academics</h2><p class="sub">Semester → Subject → Unit → Topic</p>
<div class="tabs">${[1,2,3,4,5,6,7,8].map(n=>`<button class="${n===sem?'on':''}" onclick="sem=${n};S.settings.sem=${n};save();render()">Sem ${n}</button>`).join('')}</div>
<div class="row" style="margin-bottom:14px"><button class="btn" onclick="addSub()">+ Add subject</button></div>
${subs.length?subs.map(s=>`<div class="card" style="margin-bottom:12px"><div class="row sp"><div><b>${esc(s.name)}</b> <span class="tag">${esc(s.code||'no code')}</span> <span class="tag">${s.credits??'–'} cr</span><div class="lbl">${s.units.length} units · ${topicsOf(s).length} topics · ${hrs(S.sessions.filter(x=>x.sid===s.id).reduce((a,x)=>a+x.secs,0))} studied</div></div><div class="row"><span class="num big" style="font-size:22px">${pct(s)}%</span><button class="btn ghost sm" onclick="opn['${s.id}']=!opn['${s.id}'];render()">${opn[s.id]?'Hide':'Open'}</button></div></div><div class="bar" style="margin-top:8px"><i style="width:${pct(s)}%"></i></div>
${opn[s.id]?`<div style="margin-top:12px"><div class="row" style="margin-bottom:8px"><button class="btn ghost sm" onclick="addUnit('${s.id}')">+ Unit</button><button class="btn danger sm" onclick="delSub('${s.id}')">Delete subject</button></div>

async function delGoal(id){if(await sure('Delete this goal?')){S.goals=S.goals.filter(x=>x.id!==id);save();render()}}
V.goals=()=>{const d=today(),lim={today:0,week:7,month:30,sem:180,year:365},l=S.goals.filter(g=>gv==='all'||(g.due&&gpct(g)<100&&dd(g.due)<=lim[gv]));
return `${trackSection()}<h3 style="margin:22px 0 4px">Goals with milestones</h3><p class="sub">Daily to yearly goals with milestones, subtasks and progress history.</p><div class="row" style="margin-bottom:12px">${topBtn('+ Goal',"ed('goal')")}</div><div class="tabs">${[['all','All'],['today','Daily'],['week','Weekly'],['month','Monthly'],['sem','Semester'],['year','Yearly']].map(x=>`<button class="${x[0]===gv?'on':''}" onclick="gv='${x[0]}';render()">${x[1]}</button>`).join('')}</div>${l.length?l.map(g=>{const p=gpct(g),o=opn['g'+g.id];return `<div class="card" style="margin-bottom:12px"><div class="row sp"><div><b>${esc(g.title)}</b> <span class="tag">${esc(g.cat||'Goal')}</span>${g.prio?` <span class="tag">${g.prio}</span>`:''}${p>=100?' <span class="tag" style="color:var(--lime)">Completed</span>':''}<div class="lbl">${g.start?'From '+g.start+' ':''}${g.due?'· due '+g.due:''}${g.target?` · ${g.cur}/${g.target} ${esc(g.unit||'')}`:''}</div></div><span class="num big" style="font-size:22px">${p}%</span></div>${PB(p)}${g.desc?`<p class="lbl" style="margin-top:6px">${esc(g.desc)}</p>`:''}<div class="row" style="margin-top:8px"><button class="btn ghost sm" onclick="opn['g${g.id}']=!opn['g${g.id}'];render()">${o?'Hide':'Milestones and history'}</button>${g.target?`<button class="btn ghost sm" onclick="logGoal('${g.id}')">+ Log progress</button>`:''}<button class="btn ghost sm" onclick="ed('goal','${g.id}')">Edit</button><button class="btn ghost sm" onclick="delGoal('${g.id}')">Delete</button></div>${o?`<div style="margin-top:10px"><div class="row sp"><b>Milestones and subtasks</b>${topBtn('+ Add',`gMs('${g.id}')`)}</div>${(g.ms||[]).length?g.ms.map(m=>`<div class="item row sp"><label class="row" style="gap:8px"><input type="checkbox" ${m.done?'checked':''} onchange="gTog('${g.id}','${m.id}')">${esc(m.t)}</label><button class="btn ghost sm" aria-label="Delete milestone" onclick="gMsDel('${g.id}','${m.id}')">✕</button></div>`).join(''):emp('No milestones. Progress uses the value you entered.')}${g.notes?`<p class="lbl" style="margin-top:8px"><b>Notes:</b> ${esc(g.notes)}</p>`:''}<div class="lbl" style="margin-top:8px">History: ${(g.hist||[]).length?g.hist.slice(-8).map(h=>h.date.slice(5)+' '+h.pct+'%').join(' → '):'none yet'}</div></div>`:''}</div>`}).join(''):emp('No goals for this view.')}`};
/* DASHBOARD */
const _dash=V.dashboard,wdk=k=>!(S.settings.wd&&S.settings.wd[k]===0);
V.dashboard=()=>{const d=today(),hr=new Date().getHours(),gr=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening',al=notifs(),tk=S.tasks.filter(t=>t.due===d),gp=S.goals.length?Math.round(S.goals.reduce((a,g)=>a+gpct(g),0)/S.goals.length):0,w=lastN(7).map(x=>[x,secsOn(x)]),mx=Math.max(...w.map(x=>x[1]),1);let h='';
if(wdk('welcome'))h+=`<div class="card" style="margin-bottom:14px"><h2>${gr}${S.settings.name?', '+esc(S.settings.name):''}</h2><div class="row" style="margin-top:10px">${topBtn('+ Task',"ed('task')")}<button class="btn ghost sm" onclick="go('focus')">Start focus</button><button class="btn ghost sm" onclick="addEv()">+ Event</button><button class="btn ghost sm" onclick="go('today')">Habits and review</button><button class="btn ghost sm" onclick="ed('goal')">+ Goal</button></div></div>`;
h+=_dash();
h+=`<div class="grid">`;
if(wdk('alerts'))h+=`<div class="card"><h3>Reminders</h3>${al.length?al.slice(0,6).map(x=>`<div class="item row sp" style="cursor:pointer" onclick="go('${x[2]}')"><span><span class="tag">${x[0]}</span> ${esc(x[1])}</span></div>`).join(''):emp('Nothing needs attention.')}</div>`;
if(wdk('tasks'))h+=`<div class="card"><h3>Today’s tasks</h3>${tk.length?tk.map(t=>`<div class="item"><label class="row" style="gap:8px"><input type="checkbox" ${t.done?'checked':''} onchange="togTask('${t.id}')">${esc(t.title)}</label></div>`).join(''):emp('No tasks today.')}<p class="lbl" style="margin-top:8px">Goals: ${gp}% average progress across ${S.goals.length} goals</p></div>`;
if(wdk('week'))h+=`<div class="card"><h3>Weekly productivity</h3><div class="bars" style="height:100px">${w.map(x=>`<div><i style="height:${x[1]/mx*100}%"></i><span>${pd(x[0]).toLocaleDateString(undefined,{weekday:'short'})}</span></div>`).join('')}</div></div>`;
if(wdk('recent'))h+=`<div class="card"><h3>Recently opened</h3>${S.recent.length?S.recent.map(p=>`<div class="item" style="cursor:pointer" onclick="go('${p}')">${(PAGES.find(x=>x[0]===p)||[0,p])[1]}</div>`).join(''):emp('Pages you open appear here.')}</div>`;
return h+'</div>'};
/* ANALYTICS */
let anR=30,anS='';
const _an=V.analytics;
V.analytics=()=>{const ds=lastN(anR),sv=ds.map(x=>S.sessions.filter(s=>s.date===x&&(!anS||s.sid===anS)).reduce((a,s)=>a+s.secs,0)),mx=Math.max(...sv,1),gs=S.goals,g=gstat(),ps=S.projects,hb=S.habits.length?pcn(S.habits.reduce((a,h)=>a+lastN(14).filter(x=>h.log[x]).length,0),S.habits.length*14):null,ex=S.events.filter(e=>e.type==='exam'&&e.got!=null&&e.max).sort((a,b)=>a.date.localeCompare(b.date)),sk=S.skills.length?Math.round(S.skills.reduce((a,s)=>a+(+s.prog||0),0)/S.skills.length):null;
return _an()+`<div class="card" style="margin-top:14px"><div class="row sp"><h3>Study hours by day</h3><span class="row"><select aria-label="Range" onchange="anR=+this.value;render()">${[7,30,90].map(x=>`<option value="${x}" ${x===anR?'selected':''}>Last ${x} days</option>`).join('')}</select><select aria-label="Subject filter" onchange="anS=this.value;render()"><option value="">All subjects</option>${S.subjects.map(s=>`<option value="${s.id}" ${s.id===anS?'selected':''}>${esc(s.name)} (Sem ${s.sem})</option>`).join('')}</select></span></div><div class="bars" style="gap:${anR>30?1:4}px">${sv.map((s,i)=>`<div title="${ds[i]}: ${hrs(s)}"><i style="height:${s/mx*100}%;${s?'':'opacity:.2'}"></i></div>`).join('')}</div><p class="lbl">Total ${hrs(sv.reduce((a,b)=>a+b,0))}</p></div>
<div class="grid" style="margin-top:14px"><div class="card"><div class="lbl">Goal completion</div><div class="big num">${gs.length?pcn(gs.filter(x=>gpct(x)>=100).length,gs.length)+'%':'–'}</div><div class="lbl">${gs.filter(x=>gpct(x)>=100).length} of ${gs.length} completed</div></div><div class="card"><div class="lbl">GATE readiness</div><div class="big num">${g.tp.length||g.pt||g.mk.length?g.ready+'%':'–'}</div></div><div class="card"><div class="lbl">Projects completed</div><div class="big num">${ps.length?pcn(ps.filter(p=>p.st==='Completed').length,ps.length)+'%':'–'}</div><div class="lbl">${ps.length} total</div></div><div class="card"><div class="lbl">Habit consistency (14 days)</div><div class="big num">${hb===null?'–':hb+'%'}</div></div><div class="card"><div class="lbl">Average skill progress</div><div class="big num">${sk===null?'–':sk+'%'}</div></div></div>
<div class="grid"><div class="card"><h3>Exam performance</h3>${ex.length?ex.map(e=>`<div class="item"><div class="row sp"><span>${esc(e.title)} <span class="lbl">${esc(sname(e.sid))}</span></span><span class="num">${Math.round(e.got/e.max*100)}%</span></div>${PB(e.got/e.max*100)}</div>`).join(''):emp('Add marks to exams to see performance.')}</div><div class="card"><h3>SGPA by semester</h3>${S.sgpa.length?[...S.sgpa].sort((a,b)=>a.sem-b.sem).map(x=>`<div class="item"><div class="row sp"><span>Semester ${x.sem}</span><span class="num">${x.sgpa}</span></div>${PB(x.sgpa*10)}</div>`).join(''):emp('Add SGPA in Exams.')}</div></div>`};
/* EXAMS extras */
const _ex=V.exams;
async function exNote(id){const e=S.events.find(x=>x.id===id),r=await modal('Post-exam analysis',[{k:'n',l:'What went well, mistakes, topics to improve',t:'textarea',v:e.note||''}]);if(!r)return;e.note=r.n;save();render()}
async function attSet(id){const a=S.att[id]||{held:'',att:''},r=await modal('Attendance: '+sname(id),[{k:'h',l:'Classes held',t:'number',r:1,v:a.held},{k:'a',l:'Classes attended',t:'number',r:1,v:a.att}],{check:v=>+v.a>+v.h?'Attended cannot exceed held.':+v.h<0||+v.a<0?'Values cannot be negative.':''});if(!r)return;S.att[id]={held:+r.h,att:+r.a};save();render()}
function cgpa(){const l=S.sgpa.filter(x=>x.sgpa!=null);if(!l.length)return null;const w=l.reduce((a,x)=>a+(x.credits||1),0);return (l.reduce((a,x)=>a+x.sgpa*(x.credits||1),0)/w).toFixed(2)}
V.exams=()=>{const am=S.settings.attMin||75,past=S.events.filter(e=>e.type==='exam'&&e.date<today()),bySub={};S.events.filter(e=>e.type==='exam'&&e.got!=null&&e.max).forEach(e=>{(bySub[e.sid]=bySub[e.sid]||[]).push(e.got/e.max*100)});
return _ex()+`<div class="grid" style="margin-top:14px"><div class="card"><div class="row sp"><h3>CGPA and SGPA</h3>${topBtn('+ SGPA',"ed('sgpa')")}</div><div class="big num">${cgpa()||'–'}</div><div class="lbl">CGPA ${S.sgpa.some(x=>x.credits)?'(credit weighted)':'(simple average)'}</div>${[...S.sgpa].sort((a,b)=>a.sem-b.sem).map(x=>`<div class="item row sp"><span>Semester ${x.sem}</span><span class="row"><b class="num">${x.sgpa}</b><button class="btn ghost sm" onclick="ed('sgpa','${x.id}')">Edit</button></span></div>`).join('')}</div>
<div class="card"><h3>Subject-wise marks (average)</h3>${Object.keys(bySub).length?Object.entries(bySub).map(([k,v])=>`<div class="item"><div class="row sp"><span>${esc(sname(k)||'No subject')}</span><span class="num">${Math.round(v.reduce((a,b)=>a+b,0)/v.length)}%</span></div>${PB(v.reduce((a,b)=>a+b,0)/v.length)}</div>`).join(''):emp('Marks appear after you enter them on exams.')}</div></div>
<div class="card" style="margin-top:14px"><div class="row sp"><h3>Attendance (minimum ${am}%)</h3></div>${S.subjects.filter(s=>s.sem===sem).length?S.subjects.filter(s=>s.sem===sem).map(s=>{const a=S.att[s.id],p=a&&a.held?Math.round(a.att/a.held*100):null;return `<div class="item row sp"><span>${esc(s.name)} ${p!==null?`<span class="tag" style="${p<am?'color:var(--co)':''}">${p}% (${a.att}/${a.held})</span>`:''}</span><button class="btn ghost sm" onclick="attSet('${s.id}')">Update</button></div>`}).join(''):emp('Add subjects for the current semester in Academics.')}</div>
<div class="card" style="margin-top:14px"><div class="row sp"><h3>Assignments</h3>${topBtn('+ Assignment',"ed('asg')")}</div>${S.asg.length?[...S.asg].sort((a,b)=>a.due.localeCompare(b.due)).map(x=>`<div class="item row sp"><span>${esc(x.title)} <span class="lbl">${esc(sname(x.sid))} · due ${x.due}</span> <span class="tag" style="${x.st==='Pending'&&x.due<today()?'color:var(--co)':''}">${x.st}</span></span><button class="btn ghost sm" onclick="ed('asg','${x.id}')">Edit</button></div>`).join(''):emp('No assignments yet.')}</div>
<div class="card" style="margin-top:14px"><h3>Post-exam analysis</h3>${past.length?past.map(e=>`<div class="item row sp"><span>${esc(e.title)} <span class="lbl">${esc(sname(e.sid))} · ${e.date}${e.got!=null&&e.max?' · '+e.got+'/'+e.max:''}</span>${e.note?`<div class="lbl">${esc(e.note)}</div>`:''}</span><button class="btn ghost sm" onclick="exNote('${e.id}')">${e.note?'Edit':'Add'} analysis</button></div>`).join(''):emp('Past exams appear here for review.')}</div>`};
/* SETTINGS extras */
const _set=V.settings;
async function addCat(t){const r=await modal('New '+(t==='goal'?'goal':'project')+' category',[{k:'n',l:'Category name',r:1}]);if(!r)return;S.settings.cats=S.settings.cats||{goal:[],proj:[]};(S.settings.cats[t]=S.settings.cats[t]||[]).push(r.n);save();render()}
function wdSet(k,v){S.settings.wd=S.settings.wd||{};S.settings.wd[k]=v?1:0;save();render()}
V.settings=()=>_set()+`<div class="card" style="margin-top:14px"><h3>Profile and dashboard</h3><label class="fl">Your name<input value="${esc(S.settings.name||'')}" onchange="S.settings.name=this.value.trim();save();render()"></label><label class="fl" style="margin-top:8px">Minimum attendance %<input type="number" min="1" max="100" value="${S.settings.attMin||75}" onchange="const v=+this.value;if(v>=1&&v<=100){S.settings.attMin=v;save()}else toast('Enter 1 to 100.')"></label><div class="lbl" style="margin:10px 0 4px">Dashboard widgets</div><div class="row">${[['welcome','Welcome'],['alerts','Reminders'],['tasks','Tasks'],['week','Weekly chart'],['recent','Recent']].map(x=>`<label class="row" style="gap:6px"><input type="checkbox" ${wdk(x[0])?'checked':''} onchange="wdSet('${x[0]}',this.checked)">${x[1]}</label>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn ghost sm" onclick="addCat('goal')">+ Goal category</button><button class="btn ghost sm" onclick="addCat('proj')">+ Project category</button></div></div>`;
/* recent pages */
function trk(){if(page!=='dashboard'&&S.recent[0]!==page){S.recent=[page,...S.recent.filter(x=>x!==page)].slice(0,5);save()}}

addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(V[p]&&p!==page){page=p;render()}});
render();
</script></body></html>
